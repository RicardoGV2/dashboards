name: Erase-all feature bundle
on:
  push:
    branches: [feat/erase-all]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format feature files
        run: npm exec prettier -- --write "apps/web/*.{ts,css,html}" "tests/**/*.ts"
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run build:pages
      - name: Commit formatted source and Pages build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web tests index.html assets .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Format erase-all workflow and refresh Pages build"
            git push origin HEAD:feat/erase-all
          fi
