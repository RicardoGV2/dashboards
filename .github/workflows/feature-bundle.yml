name: Feature bundle
on:
  push:
    branches: [feat/images-and-cube]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format feature files
        run: npm exec prettier -- --write "apps/web/*.{ts,css,html}" "packages/**/*.ts" "tests/**/*.ts" playwright.config.ts tsconfig.json package.json
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run build:pages
      - name: Commit formatted source and Pages build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web packages tests playwright.config.ts tsconfig.json package.json index.html assets .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Format rich widgets and refresh Pages build"
            git push origin HEAD:feat/images-and-cube
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-feature-bundle
          if-no-files-found: error
          path: |
            apps/web/index.html
            apps/web/main.ts
            apps/web/style.css
            packages/document/index.ts
            packages/widgets/index.ts
            packages/engine/renderer/index.ts
            packages/engine/history/index.ts
            tests/core.test.ts
            tests/browser/editor.spec.ts
            index.html
            assets/
            .nojekyll
